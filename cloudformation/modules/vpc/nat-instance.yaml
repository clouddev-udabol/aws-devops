AWSTemplateFormatVersion: "2010-09-09"
Description: |
  UDABOL ERP-Agent - NAT Instance (t4g.nano Graviton) para egress a internet en DEV/QA.
  Reemplaza NAT Gateway administrado (~$32/mes) por EC2 (~$3.50/mes). ADR-FINOPS-001.
  SourceDestCheck: false habilitado para forwarding de paquetes de terceros.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, qa, prod]

  Entorno:
    Type: String
    AllowedValues: [desarrollo, staging, produccion]

  VpcStackName:
    Type: String
    Description: "Nombre del stack VPC base (iaapp-vpc-dev / iaapp-vpc-qa)"

  InstanceType:
    Type: String
    Default: t4g.nano
    AllowedValues: [t4g.nano, t4g.micro, t4g.small]
    Description: "t4g.nano ($3.50/mes) es suficiente para DEV/QA sin HA"

Resources:

  # ── AMI: Amazon Linux 2023 ARM64 via SSM (siempre la última) ─────────────────
  # Resolución automática — no requiere actualizar el template al rotar AMIs

  # ── Security Group ────────────────────────────────────────────────────────────
  NatInstanceSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "udabol-nat-instance-${Environment}"
      GroupDescription: !Sub "NAT Instance ${Environment} - forward desde subnet privada"
      VpcId:
        !ImportValue
          "Fn::Sub": "${VpcStackName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: "-1"
          CidrIp:
            !ImportValue
              "Fn::Sub": "${VpcStackName}-VpcCidr"
          Description: "All traffic from VPC CIDR to NAT instance"
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
          Description: "Unrestricted egress to internet"
      Tags:
        - Key: Name
          Value: !Sub "udabol-nat-instance-${Environment}"
        - Key: Entorno
          Value: !Ref Entorno
        - Key: Proyecto
          Value: udabol-erp-agent

  # ── Launch Template — TagSpecifications para cumplir SCP p-lgafaevf ─────────────
  # El SCP requiere tag Entorno en network-interface/* al hacer RunInstances.
  # AWS::EC2::Instance.Tags solo tagea la instancia; el ENI implícito queda sin tag.
  # TagSpecifications en el Launch Template propaga el tag al ENI en el mismo RunInstances.
  NatLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "udabol-nat-lt-${Environment}"
      LaunchTemplateData:
        InstanceType: !Ref InstanceType
        ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}"
        NetworkInterfaces:
          - DeviceIndex: 0
            SubnetId:
              !ImportValue
                "Fn::Sub": "${VpcStackName}-PublicSubnetA"
            Groups:
              - !Ref NatInstanceSg
            DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "udabol-nat-${Environment}"
              - Key: Entorno
                Value: !Ref Entorno
              - Key: Proyecto
                Value: udabol-erp-agent
          - ResourceType: network-interface
            Tags:
              - Key: Entorno
                Value: !Ref Entorno
              - Key: Proyecto
                Value: udabol-erp-agent
        UserData:
          Fn::Base64: |
            #!/bin/bash
            set -xe
            dnf install -y iptables iptables-services
            echo "net.ipv4.ip_forward = 1" > /etc/sysctl.d/99-nat.conf
            sysctl -p /etc/sysctl.d/99-nat.conf
            IFACE=$(ip route show default | awk '/default/ {print $5; exit}')
            iptables -t nat -A POSTROUTING -o "$IFACE" -j MASQUERADE
            iptables -A FORWARD -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
            iptables -A FORWARD -j ACCEPT
            service iptables save
            systemctl enable iptables

  # ── NAT Instance ──────────────────────────────────────────────────────────────
  NatInstance:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref NatLaunchTemplate
        Version: !GetAtt NatLaunchTemplate.LatestVersionNumber
      SourceDestCheck: false
      Tags:
        - Key: Name
          Value: !Sub "udabol-nat-${Environment}"
        - Key: Entorno
          Value: !Ref Entorno
        - Key: Proyecto
          Value: udabol-erp-agent

  # ── Ruta 0.0.0.0/0 en la tabla privada (App) apuntando a la NAT Instance ─────
  # Sin esta ruta, los ECS tasks en AppSubnetA no tienen egress a internet
  NatRoutePrivateApp:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        !ImportValue
          "Fn::Sub": "${VpcStackName}-RouteTablePrivateApp"
      DestinationCidrBlock: "0.0.0.0/0"
      InstanceId: !Ref NatInstance

Outputs:
  NatInstanceId:
    Value: !Ref NatInstance
    Export:
      Name: !Sub "${AWS::StackName}-NatInstanceId"

  NatInstancePrivateIp:
    Value: !GetAtt NatInstance.PrivateIp
    Export:
      Name: !Sub "${AWS::StackName}-NatInstancePrivateIp"

  NatInstanceSgId:
    Value: !Ref NatInstanceSg
    Export:
      Name: !Sub "${AWS::StackName}-NatInstanceSgId"
