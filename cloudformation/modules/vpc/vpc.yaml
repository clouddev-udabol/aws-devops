AWSTemplateFormatVersion: '2010-09-09'
Description: >
  iaapp (UDABOL) — SOW-001 — Módulo base VPC 3 capas.
  Soporta modo Single-AZ (DEV/QA — ahorro) y Multi-AZ (PROD — alta disponibilidad).
  Owner: ayrton.irusta@gmail.com

# ============================================================
# METADATOS
# ============================================================
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Identificación del ambiente"
        Parameters:
          - Environment
          - ProjectName
      - Label:
          default: "Configuración de red VPC"
        Parameters:
          - VpcCidr
          - PublicSubnetACidr
          - AppSubnetACidr
          - DataSubnetACidr
      - Label:
          default: "Alta disponibilidad (Multi-AZ)"
        Parameters:
          - MultiAZ
          - PublicSubnetBCidr
          - AppSubnetBCidr
          - DataSubnetBCidr
      - Label:
          default: "Zonas de disponibilidad"
        Parameters:
          - AvailabilityZoneA
          - AvailabilityZoneB
      - Label:
          default: "Opciones de red"
        Parameters:
          - EnableNatGateway
          - EnableFlowLogs
          - FlowLogsRetentionDays
    ParameterLabels:
      Environment:
        default: "Ambiente (dev/qa/prod)"
      ProjectName:
        default: "Nombre del proyecto"
      VpcCidr:
        default: "CIDR de la VPC"
      MultiAZ:
        default: "¿Habilitar segunda AZ? (false = Single-AZ para ahorro)"
      EnableNatGateway:
        default: "¿Habilitar NAT Gateway?"
      EnableFlowLogs:
        default: "¿Habilitar VPC Flow Logs?"

# ============================================================
# PARÁMETROS
# ============================================================
Parameters:

  Environment:
    Type: String
    AllowedValues: [dev, qa, prod]
    Description: "Ambiente de despliegue"

  ProjectName:
    Type: String
    Default: iaapp
    Description: "Nombre del proyecto (usado en tags y nombres de recursos)"

  Company:
    Type: String
    Default: udabol
    Description: "Empresa / institución dueña del recurso"

  Owner:
    Type: String
    Default: ayrton.irusta@gmail.com
    Description: "Email del responsable técnico del recurso"

  VpcCidr:
    Type: String
    Description: "CIDR block principal de la VPC (ej: 10.10.0.0/16)"
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"
    ConstraintDescription: "Debe ser un CIDR válido, ej: 10.10.0.0/16"

  MultiAZ:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      'false' = Single-AZ (DEV/QA) — 3 subnets, menor costo.
      'true'  = Multi-AZ  (PROD)   — 6 subnets, alta disponibilidad.

  # Capa 1 — Exposición pública
  PublicSubnetACidr:
    Type: String
    Description: "CIDR subnet pública AZ-a (Capa 1)"
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"

  PublicSubnetBCidr:
    Type: String
    Description: "CIDR subnet pública AZ-b (Capa 1) — solo si MultiAZ=true"
    Default: "0.0.0.0/32"

  # Capa 2 — Servicios / Aplicación
  AppSubnetACidr:
    Type: String
    Description: "CIDR subnet privada App AZ-a (Capa 2)"
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"

  AppSubnetBCidr:
    Type: String
    Description: "CIDR subnet privada App AZ-b (Capa 2) — solo si MultiAZ=true"
    Default: "0.0.0.0/32"

  # Capa 3 — Datos
  DataSubnetACidr:
    Type: String
    Description: "CIDR subnet privada Data AZ-a (Capa 3)"
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"

  DataSubnetBCidr:
    Type: String
    Description: "CIDR subnet privada Data AZ-b (Capa 3) — solo si MultiAZ=true"
    Default: "0.0.0.0/32"

  AvailabilityZoneA:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1a
    Description: "Zona de disponibilidad principal (Single-AZ y Multi-AZ)"

  AvailabilityZoneB:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1b
    Description: "Segunda zona de disponibilidad — solo si MultiAZ=true"

  EnableNatGateway:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "Habilitar NAT Gateway para tráfico de salida de capas privadas"

  EnableFlowLogs:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "Habilitar VPC Flow Logs hacia CloudWatch"

  FlowLogsRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 180, 365]
    Description: "Días de retención de VPC Flow Logs en CloudWatch"

# ============================================================
# MAPPINGS
# ============================================================
Mappings:
  EnvToEntorno:
    dev:  { Entorno: desarrollo }
    qa:   { Entorno: staging }
    prod: { Entorno: produccion }

# ============================================================
# CONDICIONES
# ============================================================
Conditions:
  IsMultiAZ:       !Equals [!Ref MultiAZ, "true"]
  CreateNatGateway: !Equals [!Ref EnableNatGateway, "true"]
  CreateFlowLogs:   !Equals [!Ref EnableFlowLogs, "true"]

# ============================================================
# RECURSOS
# ============================================================
Resources:

  # ----------------------------------------------------------
  # VPC
  # ----------------------------------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "vpc-${ProjectName}-${Environment}"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Company
          Value: !Ref Company
        - Key: Application
          Value: vpc
        - Key: Environment
          Value: !Ref Environment
        - Key: Entorno
          Value: !FindInMap [EnvToEntorno, !Ref Environment, Entorno]
        - Key: Owner
          Value: !Ref Owner
        - Key: ManagedBy
          Value: cloudformation
        - Key: SOW
          Value: SOW-001
        - Key: MultiAZ
          Value: !Ref MultiAZ

  # ----------------------------------------------------------
  # INTERNET GATEWAY
  # ----------------------------------------------------------
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "igw-${ProjectName}-${Environment}"
        - Key: Environment
          Value: !Ref Environment
        - Key: Entorno
          Value: !FindInMap [EnvToEntorno, !Ref Environment, Entorno]

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # ----------------------------------------------------------
  # CAPA 1 — SUBNETS PÚBLICAS (Exposición)
  # ----------------------------------------------------------
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetACidr
      AvailabilityZone: !Ref AvailabilityZoneA
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "subnet-public-${ProjectName}-${Environment}-a"
        - Key: Layer
          Value: exposure
        - Key: Type
          Value: public
        - Key: Environment
          Value: !Ref Environment
        - Key: Entorno
          Value: !FindInMap [EnvToEntorno, !Ref Environment, Entorno]

  # Solo en Multi-AZ
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Condition: IsMultiAZ
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetBCidr
      AvailabilityZone: !Ref AvailabilityZoneB
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "subnet-public-${ProjectName}-${Environment}-b"
        - Key: Layer
          Value: exposure
        - Key: Type
          Value: public
        - Key: Environment
          Value: !Ref Environment
        - Key: Entorno
          Value: !FindInMap [EnvToEntorno, !Ref Environment, Entorno]

  # ----------------------------------------------------------
  # CAPA 2 — SUBNETS PRIVADAS (Servicios / Aplicación)
  # ----------------------------------------------------------
  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref AppSubnetACidr
      AvailabilityZone: !Ref AvailabilityZoneA
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "subnet-app-${ProjectName}-${Environment}-a"
        - Key: Layer
          Value: services
        - Key: Type
          Value: private
        - Key: Environment
          Value: !Ref Environment
        - Key: Entorno
          Value: !FindInMap [EnvToEntorno, !Ref Environment, Entorno]

  # Solo en Multi-AZ
  AppSubnetB:
    Type: AWS::EC2::Subnet
    Condition: IsMultiAZ
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref AppSubnetBCidr
      AvailabilityZone: !Ref AvailabilityZoneB
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "subnet-app-${ProjectName}-${Environment}-b"
        - Key: Layer
          Value: services
        - Key: Type
          Value: private
        - Key: Environment
          Value: !Ref Environment
        - Key: Entorno
          Value: !FindInMap [EnvToEntorno, !Ref Environment, Entorno]

  # ----------------------------------------------------------
  # CAPA 3 — SUBNETS PRIVADAS (Datos)
  # ----------------------------------------------------------
  DataSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref DataSubnetACidr
      AvailabilityZone: !Ref AvailabilityZoneA
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "subnet-data-${ProjectName}-${Environment}-a"
        - Key: Layer
          Value: data
        - Key: Type
          Value: private-isolated
        - Key: Environment
          Value: !Ref Environment
        - Key: Entorno
          Value: !FindInMap [EnvToEntorno, !Ref Environment, Entorno]

  # Solo en Multi-AZ
  DataSubnetB:
    Type: AWS::EC2::Subnet
    Condition: IsMultiAZ
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref DataSubnetBCidr
      AvailabilityZone: !Ref AvailabilityZoneB
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "subnet-data-${ProjectName}-${Environment}-b"
        - Key: Layer
          Value: data
        - Key: Type
          Value: private-isolated
        - Key: Environment
          Value: !Ref Environment
        - Key: Entorno
          Value: !FindInMap [EnvToEntorno, !Ref Environment, Entorno]

  # ----------------------------------------------------------
  # NAT GATEWAY (en subnet pública AZ-a)
  # ----------------------------------------------------------
  ElasticIPNat:
    Type: AWS::EC2::EIP
    Condition: CreateNatGateway
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "eip-nat-${ProjectName}-${Environment}"
        - Key: Environment
          Value: !Ref Environment
        - Key: Entorno
          Value: !FindInMap [EnvToEntorno, !Ref Environment, Entorno]

  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: CreateNatGateway
    Properties:
      AllocationId: !GetAtt ElasticIPNat.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub "nat-${ProjectName}-${Environment}"
        - Key: Environment
          Value: !Ref Environment
        - Key: Entorno
          Value: !FindInMap [EnvToEntorno, !Ref Environment, Entorno]

  # ----------------------------------------------------------
  # TABLAS DE RUTEO
  # ----------------------------------------------------------

  # Route Table — Pública (Capa 1)
  RouteTablePublic:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "rt-public-${ProjectName}-${Environment}"
        - Key: Layer
          Value: exposure
        - Key: Environment
          Value: !Ref Environment
        - Key: Entorno
          Value: !FindInMap [EnvToEntorno, !Ref Environment, Entorno]

  RoutePublicInternet:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTablePublic
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssocPublicA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref RouteTablePublic

  SubnetRouteTableAssocPublicB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: IsMultiAZ
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref RouteTablePublic

  # Route Table — Privada App (Capa 2)
  RouteTablePrivateApp:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "rt-private-app-${ProjectName}-${Environment}"
        - Key: Layer
          Value: services
        - Key: Environment
          Value: !Ref Environment
        - Key: Entorno
          Value: !FindInMap [EnvToEntorno, !Ref Environment, Entorno]

  RoutePrivateAppNat:
    Type: AWS::EC2::Route
    Condition: CreateNatGateway
    Properties:
      RouteTableId: !Ref RouteTablePrivateApp
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGateway

  SubnetRouteTableAssocAppA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnetA
      RouteTableId: !Ref RouteTablePrivateApp

  SubnetRouteTableAssocAppB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: IsMultiAZ
    Properties:
      SubnetId: !Ref AppSubnetB
      RouteTableId: !Ref RouteTablePrivateApp

  # Route Table — Privada Data (Capa 3) — solo tráfico local
  RouteTablePrivateData:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "rt-private-data-${ProjectName}-${Environment}"
        - Key: Layer
          Value: data
        - Key: Environment
          Value: !Ref Environment
        - Key: Entorno
          Value: !FindInMap [EnvToEntorno, !Ref Environment, Entorno]

  SubnetRouteTableAssocDataA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DataSubnetA
      RouteTableId: !Ref RouteTablePrivateData

  SubnetRouteTableAssocDataB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: IsMultiAZ
    Properties:
      SubnetId: !Ref DataSubnetB
      RouteTableId: !Ref RouteTablePrivateData

  # ----------------------------------------------------------
  # NETWORK ACLs
  # ----------------------------------------------------------

  # NACL Capa 1 — Exposición
  NaclPublic:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "nacl-public-${ProjectName}-${Environment}"
        - Key: Layer
          Value: exposure

  NaclPublicInboundHTTP:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref NaclPublic
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: "0.0.0.0/0"
      PortRange: { From: 80, To: 80 }

  NaclPublicInboundHTTPS:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref NaclPublic
      RuleNumber: 110
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: "0.0.0.0/0"
      PortRange: { From: 443, To: 443 }

  NaclPublicInboundEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref NaclPublic
      RuleNumber: 120
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: "0.0.0.0/0"
      PortRange: { From: 1024, To: 65535 }

  NaclPublicOutboundAll:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref NaclPublic
      RuleNumber: 200
      Protocol: -1
      RuleAction: allow
      Egress: true
      CidrBlock: "0.0.0.0/0"

  NaclPublicAssocA:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      NetworkAclId: !Ref NaclPublic

  NaclPublicAssocB:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Condition: IsMultiAZ
    Properties:
      SubnetId: !Ref PublicSubnetB
      NetworkAclId: !Ref NaclPublic

  # NACL Capa 2 — Servicios
  NaclApp:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "nacl-app-${ProjectName}-${Environment}"
        - Key: Layer
          Value: services

  NaclAppInboundFromPublic:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref NaclApp
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: !Ref VpcCidr
      PortRange: { From: 1024, To: 65535 }

  NaclAppInboundAppPorts:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref NaclApp
      RuleNumber: 110
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: !Ref VpcCidr
      PortRange: { From: 8080, To: 8443 }

  NaclAppOutboundAll:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref NaclApp
      RuleNumber: 200
      Protocol: -1
      RuleAction: allow
      Egress: true
      CidrBlock: "0.0.0.0/0"

  NaclAppAssocA:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref AppSubnetA
      NetworkAclId: !Ref NaclApp

  NaclAppAssocB:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Condition: IsMultiAZ
    Properties:
      SubnetId: !Ref AppSubnetB
      NetworkAclId: !Ref NaclApp

  # NACL Capa 3 — Datos
  NaclData:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "nacl-data-${ProjectName}-${Environment}"
        - Key: Layer
          Value: data

  NaclDataInboundMySQL:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref NaclData
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: !Ref VpcCidr
      PortRange: { From: 3306, To: 3306 }

  NaclDataInboundPostgres:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref NaclData
      RuleNumber: 110
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: !Ref VpcCidr
      PortRange: { From: 5432, To: 5432 }

  NaclDataInboundRedis:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref NaclData
      RuleNumber: 120
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: !Ref VpcCidr
      PortRange: { From: 6379, To: 6379 }

  NaclDataOutboundEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref NaclData
      RuleNumber: 200
      Protocol: 6
      RuleAction: allow
      Egress: true
      CidrBlock: !Ref VpcCidr
      PortRange: { From: 1024, To: 65535 }

  NaclDataAssocA:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref DataSubnetA
      NetworkAclId: !Ref NaclData

  NaclDataAssocB:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Condition: IsMultiAZ
    Properties:
      SubnetId: !Ref DataSubnetB
      NetworkAclId: !Ref NaclData

  # ----------------------------------------------------------
  # VPC FLOW LOGS
  # ----------------------------------------------------------
  FlowLogsLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateFlowLogs
    Properties:
      LogGroupName: !Sub "/vpc/flowlogs/${ProjectName}/${Environment}"
      RetentionInDays: !Ref FlowLogsRetentionDays

  FlowLogsRole:
    Type: AWS::IAM::Role
    Condition: CreateFlowLogs
    Properties:
      RoleName: !Sub "role-vpc-flowlogs-${ProjectName}-${Environment}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FlowLogsToCloudWatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: !GetAtt FlowLogsLogGroup.Arn

  VPCFlowLog:
    Type: AWS::EC2::FlowLog
    Condition: CreateFlowLogs
    Properties:
      ResourceId: !Ref VPC
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogsLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogsRole.Arn
      Tags:
        - Key: Name
          Value: !Sub "flowlog-${ProjectName}-${Environment}"
        - Key: Environment
          Value: !Ref Environment
        - Key: Entorno
          Value: !FindInMap [EnvToEntorno, !Ref Environment, Entorno]

# ============================================================
# OUTPUTS
# ============================================================
Outputs:

  VpcId:
    Description: "ID de la VPC"
    Value: !Ref VPC
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"

  VpcCidrOutput:
    Description: "CIDR block de la VPC"
    Value: !Ref VpcCidr
    Export:
      Name: !Sub "${AWS::StackName}-VpcCidr"

  MultiAZEnabled:
    Description: "Modo Multi-AZ habilitado"
    Value: !Ref MultiAZ
    Export:
      Name: !Sub "${AWS::StackName}-MultiAZ"

  PublicSubnetAId:
    Description: "ID subnet pública AZ-a (Capa 1)"
    Value: !Ref PublicSubnetA
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetA"

  PublicSubnetBId:
    Description: "ID subnet pública AZ-b (Capa 1) — solo Multi-AZ"
    Condition: IsMultiAZ
    Value: !Ref PublicSubnetB
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetB"

  AppSubnetAId:
    Description: "ID subnet privada App AZ-a (Capa 2)"
    Value: !Ref AppSubnetA
    Export:
      Name: !Sub "${AWS::StackName}-AppSubnetA"

  AppSubnetBId:
    Description: "ID subnet privada App AZ-b (Capa 2) — solo Multi-AZ"
    Condition: IsMultiAZ
    Value: !Ref AppSubnetB
    Export:
      Name: !Sub "${AWS::StackName}-AppSubnetB"

  DataSubnetAId:
    Description: "ID subnet privada Data AZ-a (Capa 3)"
    Value: !Ref DataSubnetA
    Export:
      Name: !Sub "${AWS::StackName}-DataSubnetA"

  DataSubnetBId:
    Description: "ID subnet privada Data AZ-b (Capa 3) — solo Multi-AZ"
    Condition: IsMultiAZ
    Value: !Ref DataSubnetB
    Export:
      Name: !Sub "${AWS::StackName}-DataSubnetB"

  NatGatewayId:
    Description: "ID del NAT Gateway"
    Condition: CreateNatGateway
    Value: !Ref NatGateway
    Export:
      Name: !Sub "${AWS::StackName}-NatGatewayId"

  NatGatewayPublicIP:
    Description: "IP pública del NAT Gateway"
    Condition: CreateNatGateway
    Value: !Ref ElasticIPNat
    Export:
      Name: !Sub "${AWS::StackName}-NatGatewayPublicIP"

  RouteTablePublicId:
    Description: "ID Route Table pública"
    Value: !Ref RouteTablePublic
    Export:
      Name: !Sub "${AWS::StackName}-RouteTablePublic"

  RouteTablePrivateAppId:
    Description: "ID Route Table privada App"
    Value: !Ref RouteTablePrivateApp
    Export:
      Name: !Sub "${AWS::StackName}-RouteTablePrivateApp"

  RouteTablePrivateDataId:
    Description: "ID Route Table privada Data"
    Value: !Ref RouteTablePrivateData
    Export:
      Name: !Sub "${AWS::StackName}-RouteTablePrivateData"

  InternetGatewayId:
    Description: "ID del Internet Gateway"
    Value: !Ref InternetGateway
    Export:
      Name: !Sub "${AWS::StackName}-InternetGateway"
