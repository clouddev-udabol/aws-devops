AWSTemplateFormatVersion: "2010-09-09"
Description: "SOW-002 | ECR repositories for agt-* microservices"

Parameters:
  Entorno:
    Type: String
    AllowedValues: [desarrollo, staging]
    Description: "SCP tag value — desarrollo=DEV, staging=QA"

  LifecycleMaxImages:
    Type: Number
    Default: 5
    Description: "Max tagged images to retain per repo"

  UntaggedExpiryDays:
    Type: Number
    Default: 1
    Description: "Days before untagged images are expired"

Resources:

  RepoCommon:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: agt-common
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last ${LifecycleMaxImages} tagged images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["v", "dev-", "qa-"],
                  "countType": "imageCountMoreThan",
                  "countNumber": ${LifecycleMaxImages}
                },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Expire untagged after ${UntaggedExpiryDays} day",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": ${UntaggedExpiryDays}
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Entorno
          Value: !Ref Entorno
        - Key: Proyecto
          Value: udabol-erp-agent
        - Key: Modulo
          Value: agt-common

