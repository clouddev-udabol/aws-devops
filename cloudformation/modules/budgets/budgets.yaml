AWSTemplateFormatVersion: '2010-09-09'
Description: >
  iaapp — UDABOL — Monthly Cost Budget con alertas SNS a email.
  Naming: iaapp-budget-{env}  |  SOW-001 E4

Parameters:

  Environment:
    Type: String
    AllowedValues: [dev, qa, prod]
    Description: "Ambiente destino"

  ProjectName:
    Type: String
    Default: iaapp

  Company:
    Type: String
    Default: udabol

  MonthlyBudgetLimit:
    Type: Number
    Default: 100
    Description: "Límite mensual en USD"

  AlertEmail:
    Type: String
    Description: "Email que recibe las alertas de presupuesto"

  AlertThreshold50:
    Type: Number
    Default: 50
    Description: "Porcentaje de alerta temprana"

  AlertThreshold80:
    Type: Number
    Default: 80
    Description: "Porcentaje de alerta de advertencia"

  AlertThreshold100:
    Type: Number
    Default: 100
    Description: "Porcentaje de alerta crítica (100% del límite)"

Mappings:
  EnvToEntorno:
    dev:  { Entorno: desarrollo }
    qa:   { Entorno: staging }
    prod: { Entorno: produccion }

Resources:

  # ----------------------------------------------------------
  # SNS Topic — Canal de alertas del Budget
  # ----------------------------------------------------------
  BudgetAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-budget-alerts-${Environment}"
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-budget-alerts-${Environment}"
        - Key: Environment
          Value: !Ref Environment
        - Key: Entorno
          Value: !FindInMap [EnvToEntorno, !Ref Environment, Entorno]
        - Key: Project
          Value: !Ref ProjectName
        - Key: Company
          Value: !Ref Company
        - Key: ManagedBy
          Value: cloudformation
        - Key: SOW
          Value: SOW-001

  # Política que permite al servicio de Budgets publicar en el topic
  BudgetAlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref BudgetAlertTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowBudgetsPublish
            Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sns:Publish
            Resource: !Ref BudgetAlertTopic

  # ----------------------------------------------------------
  # Budget — Control de costos mensual
  # ----------------------------------------------------------
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${ProjectName}-budget-${Environment}"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetLimit
          Unit: USD
      NotificationsWithSubscribers:

        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: !Ref AlertThreshold50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BudgetAlertTopic

        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: !Ref AlertThreshold80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BudgetAlertTopic

        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: !Ref AlertThreshold100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BudgetAlertTopic

        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: !Ref AlertThreshold100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref BudgetAlertTopic

Outputs:

  BudgetName:
    Description: "Nombre del budget creado"
    Value: !Sub "${ProjectName}-budget-${Environment}"

  AlertTopicArn:
    Description: "ARN del SNS Topic de alertas"
    Value: !Ref BudgetAlertTopic
    Export:
      Name: !Sub "iaapp-${Environment}-BudgetAlertTopicArn"

  BudgetLimit:
    Description: "Límite mensual configurado"
    Value: !Sub "$${MonthlyBudgetLimit} USD/mes"
