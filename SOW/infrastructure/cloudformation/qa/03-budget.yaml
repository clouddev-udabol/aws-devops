AWSTemplateFormatVersion: "2010-09-09"
Description: "Budget for PROY-APP QA environment with daily alerts at 50%, 80%, and 100%"

Parameters:
  ProjectName:
    Type: String
    Default: "ia-app"
    Description: "Project identifier"
    AllowedValues:
      - ia-app
  
  EnvironmentName:
    Type: String
    Default: "qa"
    Description: "Environment name (qa maps to staging tag)"
    AllowedValues:
      - qa
  
  AlertEmail:
    Type: String
    Default: "cloudmanagement@udabol.edu.bo"
    Description: "Email for budget alerts"
  
  BudgetAmount:
    Type: Number
    Default: 100
    Description: "Budget amount in USD"
    MinValue: 1
    MaxValue: 10000

Conditions:
  IsQA: !Equals [!Ref EnvironmentName, "qa"]

Resources:
  # SNS Topic for Budget Alerts
  BudgetAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-${EnvironmentName}-budget-alerts"
      DisplayName: "PROY-APP Budget Alerts"
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail
      Tags:
        - Key: Entorno
          Value: staging  # QA environment uses staging tag per SCP policy
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # Budget with Daily Monitoring
  Budget:
    Type: AWS::Budgets::Budget
    DependsOn: BudgetAlertsTopic
    Properties:
      Budget:
        BudgetName: !Sub "${ProjectName}-${EnvironmentName}-budget"
        BudgetType: "COST"
        TimeUnit: "DAILY"
        BudgetLimit:
          Amount: !Ref BudgetAmount
          Unit: "USD"
        CostTypes:
          IncludeTax: true
          IncludeSubscription: true
          UseBlended: false
          IncludeRefund: false
          IncludeCredit: false
          IncludeUpfront: true
          IncludeRecurring: true
          IncludeOtherSubscription: true
          IncludeSupport: true
          IncludeDiscount: true
          UseAmortized: false
      
      NotificationsWithSubscribers:
        # Alerta 50%
        - Notification:
            NotificationType: "ACTUAL"
            ComparisonOperator: "GREATER_THAN"
            Threshold: 50
            ThresholdType: "PERCENTAGE"
          Subscribers:
            - SubscriptionType: "SNS"
              Address: !Ref BudgetAlertsTopic
        
        # Alerta 80%
        - Notification:
            NotificationType: "ACTUAL"
            ComparisonOperator: "GREATER_THAN"
            Threshold: 80
            ThresholdType: "PERCENTAGE"
          Subscribers:
            - SubscriptionType: "SNS"
              Address: !Ref BudgetAlertsTopic
        
        # Alerta 100%
        - Notification:
            NotificationType: "ACTUAL"
            ComparisonOperator: "GREATER_THAN"
            Threshold: 100
            ThresholdType: "PERCENTAGE"
          Subscribers:
            - SubscriptionType: "SNS"
              Address: !Ref BudgetAlertsTopic

  # Budget Tagging (additional layer)
  BudgetTagAssociation:
    Type: AWS::Budgets::BudgetsAction
    DependsOn: Budget
    Properties:
      AccountId: !Ref AWS::AccountId
      BudgetName: !Sub "${ProjectName}-${EnvironmentName}-budget"
      ActionThreshold:
        ActionThresholdValue: 80
        ActionThresholdType: "PERCENTAGE"
      ActionType: "APPLY_IAM_POLICY"
      ActionSubscribers:
        - SubscriptionType: "SNS"
          Address: !Ref BudgetAlertsTopic

Outputs:
  BudgetName:
    Description: "Budget name following naming convention"
    Value: !Sub "${ProjectName}-${EnvironmentName}-budget"
  
  SNSTopicArn:
    Description: "SNS Topic ARN for budget alerts"
    Value: !Ref BudgetAlertsTopic
  
  AlertEmail:
    Description: "Email receiving alerts"
    Value: !Ref AlertEmail
  
  BudgetAmount:
    Description: "Budget amount configured"
    Value: !Ref BudgetAmount
  
  EnvironmentTag:
    Description: "Environment tag value (staging for QA)"
    Value: "staging"  # Per SCP policy
