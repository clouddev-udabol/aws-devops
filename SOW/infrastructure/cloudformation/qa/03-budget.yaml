AWSTemplateFormatVersion: "2010-09-09"
Description: "Budget  for SOW-001-E4-QA with daily alerts at 50%, 80%, and 100%"

Parameters:
  AlertEmail:
    Type: String
    Default: "cloudmanagement@udabol.edu.bo"
    Description: "Email para recibir alertas del budget"
  
  BudgetName:
    Type: String
    Default: "SOW-001-E4-QA-100USD"
    Description: "Nombre del budget para SOW"
  
  BudgetAmount:
    Type: Number
    Default: 100
    Description: "Monto del budget en USD"

Resources:
  # SNS Topic para alertas
  BudgetAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "\-alerts"
      DisplayName: "SOW Budget Alerts QA"
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  # Budget con monitoreo diario
  Budget:
    Type: AWS::Budgets::Budget
    DependsOn: BudgetAlertsTopic
    Properties:
      Budget:
        BudgetName: !Ref BudgetName
        BudgetType: "COST"
        TimeUnit: "DAILY"
        BudgetLimit:
          Amount: !Ref BudgetAmount
          Unit: "USD"
        CostTypes:
          IncludeTax: true
          IncludeSubscription: true
          UseBlended: false
          IncludeRefund: false
          IncludeCredit: false
          IncludeUpfront: true
          IncludeRecurring: true
          IncludeOtherSubscription: true
          IncludeSupport: true
          IncludeDiscount: true
          UseAmortized: false
      
      NotificationsWithSubscribers:
        # Alerta 50%
        - Notification:
            NotificationType: "ACTUAL"
            ComparisonOperator: "GREATER_THAN"
            Threshold: 50
            ThresholdType: "PERCENTAGE"
          Subscribers:
            - SubscriptionType: "SNS"
              Address: !Ref BudgetAlertsTopic
        
        # Alerta 80%
        - Notification:
            NotificationType: "ACTUAL"
            ComparisonOperator: "GREATER_THAN"
            Threshold: 80
            ThresholdType: "PERCENTAGE"
          Subscribers:
            - SubscriptionType: "SNS"
              Address: !Ref BudgetAlertsTopic
        
        # Alerta 100%
        - Notification:
            NotificationType: "ACTUAL"
            ComparisonOperator: "GREATER_THAN"
            Threshold: 100
            ThresholdType: "PERCENTAGE"
          Subscribers:
            - SubscriptionType: "SNS"
              Address: !Ref BudgetAlertsTopic

Outputs:
  BudgetName:
    Description: "Budget name SOW"
    Value: !Ref BudgetName
  
  SNSTopicArn:
    Description: "SNS Topic ARN para alertas"
    Value: !Ref BudgetAlertsTopic
  
  AlertEmail:
    Description: "Email que recibe alertas"
    Value: !Ref AlertEmail
