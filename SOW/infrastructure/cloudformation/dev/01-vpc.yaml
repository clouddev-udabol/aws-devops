AWSTemplateFormatVersion: '2010-09-09'
Description: 'VPC Infrastructure with Mandatory Governance Tags for SCP Compliance'

Parameters:
  ProjectName:
    Type: String
    Default: ia-app
  EnvironmentName:
    Type: String
    Default: desarrollo
  VpcCidr:
    Type: String
    Default: 10.10.0.0/16

Resources:
  # El recurso principal suele ser el que dispara el bloqueo
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}-vpc
        # ESTE TAG ES EL QUE BUSCA LA SCP p-lgafaevf
        - Key: Entorno
          Value: desarrollo
        - Key: Project
          Value: !Ref ProjectName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-${EnvironmentName}-igw
        - Key: Entorno
          Value: desarrollo
        - Key: Project
          Value: !Ref ProjectName

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub ${ProjectName}-${EnvironmentName}-VpcId