name: Deploy PROY-APP Budget - Development

on:
  push:
    branches: [develop]
    paths:
      - 'SOW/infrastructure/cloudformation/dev/03-budget.yaml'
  workflow_dispatch:
    inputs:
      budget_amount:
        description: 'Budget amount in USD'
        required: false
        default: '50'
      alert_email:
        description: 'Alert email'
        required: false
        default: 'cloudmanagement@udabol.edu.bo'

jobs:
  deploy-budget-dev:
    runs-on: ubuntu-latest
    environment: Development
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::245650696072:role/proy-app-gha-role-development
          aws-region: us-east-1
      
      - name: Deploy Budget Stack to Development
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: ia-app-dev-budget
          template: SOW/infrastructure/cloudformation/dev/03-budget.yaml
          parameter-overrides: >-
            ProjectName=ia-app,
            EnvironmentName=dev,
            AlertEmail=${{ github.event.inputs.alert_email || 'cloudmanagement@udabol.edu.bo' }},
            BudgetAmount=${{ github.event.inputs.budget_amount || '50' }}
          capabilities: CAPABILITY_IAM
          tags: '[{"Key": "Entorno", "Value": "desarrollo"}, {"Key": "Project", "Value": "ia-app"}, {"Key": "Environment", "Value": "dev"}, {"Key": "ManagedBy", "Value": "GitHubActions"}]'
      
      - name: Get Stack Outputs
        id: stack-outputs
        run: |
          TOPIC_ARN=$(aws cloudformation describe-stacks \
            --stack-name ia-app-dev-budget \
            --query "Stacks[0].Outputs[?OutputKey=='SNSTopicArn'].OutputValue" \
            --output text)
          echo "topic_arn=$TOPIC_ARN" >> $GITHUB_OUTPUT
          echo "budget_name=$(aws cloudformation describe-stacks \
            --stack-name ia-app-dev-budget \
            --query "Stacks[0].Outputs[?OutputKey=='BudgetName'].OutputValue" \
            --output text)" >> $GITHUB_OUTPUT
          
          echo "✅ Budget deployed following naming convention: ia-app-dev-budget"
          echo "✅ Tags applied: Entorno=desarrollo, Project=ia-app"
          echo "✅ AWS Account: 245650696072 (Development)"
      
      - name: Send test notification
        run: |
          aws sns publish \
            --topic-arn ${{ steps.stack-outputs.outputs.topic_arn }} \
            --subject "✅ PROY-APP Dev Budget Deployed" \
            --message "Budget Configuration for Development Environment:

Budget Name: ${{ steps.stack-outputs.outputs.budget_name }}
Budget Amount: ${{ github.event.inputs.budget_amount || '50' }} USD
Environment: Development (Tag: desarrollo)
Monitoring: Daily
Thresholds: 50%, 80%, 100%
Alert Email: ${{ github.event.inputs.alert_email || 'cloudmanagement@udabol.edu.bo' }}
AWS Account: 245650696072

✅ Naming Convention: ia-app-dev-budget
✅ Tags Applied: Entorno=desarrollo, Project=ia-app
✅ Branch: develop
✅ OIDC Role: proy-app-gha-role-development

⚠️ IMPORTANT: Confirm subscription by clicking the link received.

Deployment Time: $(date -u)
Stack: ia-app-dev-budget"
          
          echo "✅ Test notification sent to cloudmanagement@udabol.edu.bo"
      
      - name: Verify budget compliance
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUDGET_NAME="ia-app-dev-budget"
          
          echo "=== VERIFYING COMPLIANCE - DEVELOPMENT ==="
          echo "Account ID: $ACCOUNT_ID"
          echo "Expected Account: 245650696072 (Development)"
          echo "Budget Name: $BUDGET_NAME"
          echo "Expected Format: [Project]-[Environment]-[Resource]"
          
          # Verify budget
          aws budgets describe-budgets \
            --account-id $ACCOUNT_ID \
            --budget-name $BUDGET_NAME \
            --query "Budgets[0].[BudgetName, BudgetLimit.Amount, TimeUnit]" \
            --output table
          
          # Verify account is correct for Development
          if [ "$ACCOUNT_ID" = "245650696072" ]; then
            echo "✅ Correct AWS Account for Development environment"
          else
            echo "❌ ERROR: Wrong account for Development deployment"
            exit 1
          fi
      
      - name: Create compliance summary
        run: |
          echo "## 🎯 PROY-APP Development Budget Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Governance Compliance - Development" >> $GITHUB_STEP_SUMMARY
          echo "- **Naming Convention:** ia-app-dev-budget ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Project:** ia-app ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** Development ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag Value:** desarrollo (per SCP policy) ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **AWS Account:** 245650696072 ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** us-east-1 ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** develop ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Budget Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Budget Name:** ia-app-dev-budget" >> $GITHUB_STEP_SUMMARY
          echo "- **Amount:** ${{ github.event.inputs.budget_amount || '50' }} USD" >> $GITHUB_STEP_SUMMARY
          echo "- **Type:** DAILY (Daily monitoring)" >> $GITHUB_STEP_SUMMARY
          echo "- **Time Unit:** Daily" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔔 Alert Thresholds" >> $GITHUB_STEP_SUMMARY
          echo "- **50%** - Alert at ${{ github.event.inputs.budget_amount && format('{0}', github.event.inputs.budget_amount | int * 0.5) || '25' }} USD" >> $GITHUB_STEP_SUMMARY
          echo "- **80%** - Alert at ${{ github.event.inputs.budget_amount && format('{0}', github.event.inputs.budget_amount | int * 0.8) || '40' }} USD" >> $GITHUB_STEP_SUMMARY
          echo "- **100%** - Alert at ${{ github.event.inputs.budget_amount || '50' }} USD" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📧 Notifications" >> $GITHUB_STEP_SUMMARY
          echo "- **Email:** ${{ github.event.inputs.alert_email || 'cloudmanagement@udabol.edu.bo' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **SNS Topic:** ${{ steps.stack-outputs.outputs.topic_arn }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Protocol:** Email" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🏷️ Tags Applied" >> $GITHUB_STEP_SUMMARY
          echo "- **Entorno:** desarrollo (per SCP policy p-k7ywnh7g) ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Project:** ia-app ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** dev ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **ManagedBy:** CloudFormation/GitHubActions ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Successfully deployed" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Stack Name:** ia-app-dev-budget" >> $GITHUB_STEP_SUMMARY
          echo "- **SCP Compliance:** ✅ Passed (p-k7ywnh7g)" >> $GITHUB_STEP_SUMMARY
