name: "[E1/E3] AWS Infrastructure Deployment"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: "Deploy to Development"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_DEV }}
          aws-region: us-east-1
          role-session-name: gha-session-${{ github.run_id }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Deploy VPC Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: sow-001-vpc-dev
          template: SOW/infrastructure/cloudformation/dev/01-vpc.yaml
          no-fail-on-empty-changeset: "1"
          # Agregamos parámetros mínimos necesarios
          parameter-overrides: >-
            ProjectName=ia-app,
            EnvironmentName=development,
            VpcCidr=10.10.0.0/16
          # TAGS: Es vital que coincidan exactamente con la SCP
          tags: |
            Entorno=desarrollo
            Project=ia-app