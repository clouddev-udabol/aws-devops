name: "[E1/E3] AWS Infrastructure Deployment"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: "Deploy to Development"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_DEV }}
          aws-region: us-east-1
          role-session-name: gha-session-${{ github.run_id }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Deploy VPC Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: sow-001-vpc-dev
          template: SOW/infrastructure/cloudformation/dev/01-vpc.yaml
          no-fail-on-empty-changeset: "1"
          # Parámetros en una sola línea separados por comas
          parameter-overrides: "ProjectName=ia-app,EnvironmentName=development,VpcCidr=10.10.0.0/16"
          # FORMATO ESTRICTO: En una sola línea, sin comillas adicionales. 
          # Esto evita el error de la SCP "DenyNoEntorno" en cloudformation:CreateStack
          tags: "Entorno=desarrollo Project=ia-app"