name: "[E1/E3] AWS Infrastructure Deployment"

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: "Deploy to Development"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_DEV }}
          aws-region: us-east-1

      - name: Deploy VPC Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: sow-001-vpc-dev
          template: SOW/infrastructure/cloudformation/dev/01-vpc.yaml
          parameter-overrides: >-
            ProjectName=ia-app,
            EnvironmentName=development,
            VpcCidr=10.10.0.0/16
          no-fail-on-empty-changeset: "1"
          # LLAVE DE LA SOLUCIÓN: Tags obligatorios para pasar la SCP
          tags: |
            Entorno=desarrollo
            Project=ia-app