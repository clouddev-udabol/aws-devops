name: "[E1/E3] AWS Infrastructure Deployment"

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  id-token: write   # Obligatorio para OIDC
  contents: read    # Obligatorio para leer el código

jobs:
  deploy-dev:
    name: "Deploy to Development"
    runs-on: ubuntu-latest
    # Se ejecuta solo si es la rama develop o main (según tu estándar SOW)
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_DEV }}
          aws-region: us-east-1
          role-session-name: gha-session-${{ github.run_id }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Deploy VPC Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: sow-001-vpc-dev
          template: SOW/infrastructure/cloudformation/dev/01-vpc.yaml
          # Los parámetros deben coincidir con la definición de tu 01-vpc.yaml
          parameter-overrides: >-
            ProjectName=ia-app,
            EnvironmentName=development,
            VpcCidr=10.10.0.0/16,
            TicketId=SOW-001,
            AvailabilityZone=us-east-1a
          no-fail-on-empty-changeset: "1"
          # REQUISITO CRÍTICO: Tags para cumplir con la SCP p-lgafaevf
          # La SCP exige "Entorno=desarrollo" (en minúsculas)
          tags: |
            Entorno=desarrollo
            Project=ia-app
            ManagedBy=cloudformation
            Application=platform
            Owner=cloudmanagement@udabol.edu.bo
            TicketId=SOW-001