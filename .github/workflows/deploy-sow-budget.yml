name: Deploy PROY-APP Budget

on:
  push:
    branches: [main]
    paths:
      - 'SOW/infrastructure/cloudformation/qa/03-budget.yaml'
  workflow_dispatch:
    inputs:
      budget_amount:
        description: 'Budget amount in USD'
        required: false
        default: '100'
      alert_email:
        description: 'Alert email'
        required: false
        default: 'cloudmanagement@udabol.edu.bo'

jobs:
  deploy-budget-qa:
    runs-on: ubuntu-latest
    environment: QA
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::493735739951:role/proy-app-gha-role-qa
          aws-region: us-east-1
      
      - name: Deploy Budget Stack
        run: |
          aws cloudformation deploy \
            --template-file SOW/infrastructure/cloudformation/qa/03-budget.yaml \
            --stack-name ia-app-qa-budget \
            --parameter-overrides \
              ProjectName=ia-app \
              EnvironmentName=qa \
              AlertEmail=${{ github.event.inputs.alert_email || 'cloudmanagement@udabol.edu.bo' }} \
              BudgetAmount=${{ github.event.inputs.budget_amount || '100' }} \
            --capabilities CAPABILITY_IAM \
            --tags \
              Entorno=staging \
              Project=ia-app \
              Environment=qa \
              ManagedBy=GitHubActions
      
      - name: Get Stack Outputs
        id: stack-outputs
        run: |
          TOPIC_ARN=$(aws cloudformation describe-stacks \
            --stack-name ia-app-qa-budget \
            --query "Stacks[0].Outputs[?OutputKey=='SNSTopicArn'].OutputValue" \
            --output text)
          echo "topic_arn=$TOPIC_ARN" >> $GITHUB_OUTPUT
          echo "Budget deployed successfully: ia-app-qa-budget"
      
      - name: Send Test Notification
        run: |
          aws sns publish \
            --topic-arn ${{ steps.stack-outputs.outputs.topic_arn }} \
            --subject "PROY-APP Budget Deployed to QA" \
            --message "Budget Configuration:
            
            Budget Name: ia-app-qa-budget
            Budget Amount: ${{ github.event.inputs.budget_amount || '100' }} USD
            Environment: QA
            Thresholds: 50%, 80%, 100%
            
            Please confirm subscription to receive alerts."
      
      - name: Verify Deployment
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "Account: $ACCOUNT_ID"
          
          if [ "$ACCOUNT_ID" = "493735739951" ]; then
            echo "✅ Correct AWS Account for QA"
          else
            echo "❌ Wrong AWS Account"
            exit 1
          fi
          
          aws budgets describe-budgets \
            --account-id $ACCOUNT_ID \
            --budget-name ia-app-qa-budget \
            --query "Budgets[0].[BudgetName, BudgetLimit.Amount]" \
            --output table || echo "Budget created"
