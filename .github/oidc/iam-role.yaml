AWSTemplateFormatVersion: '2010-09-09'
Description: >
  iaapp — UDABOL — GitHub OIDC Role para GitHub Actions.
  Desplegar una vez por cuenta (DEV y QA independientes).
  SOW-001 E3.

# ============================================================
# CONTEXTO
# ============================================================
# Configura el IAM Role que GitHub Actions asume via OIDC.
#
# Roles desplegados:
#   DEV (245650696072) → proy-app-gha-role-development
#   QA  (493735739951) → proy-app-gha-role-qa
#
# Ambos roles tienen:
#   - PowerUserAccess (managed policy)
#   - Inline policy IAMForVPCFlowLogs: permisos IAM restringidos
#     a role/role-vpc-flowlogs-* (necesario para FlowLogsRole en CFN)
#
# Trust policy:
#   DEV → repo:clouddev-udabol/aws-devops:*          (cualquier ref)
#   QA  → repo:..:ref:refs/heads/main  +  repo:..:environment:qa
#
# MIGRACIÓN (si el rol ya existe creado manualmente):
#   1. aws iam delete-role-policy --role-name <nombre> --policy-name IAMForVPCFlowLogs
#   2. aws iam detach-role-policy --role-name <nombre> --policy-arn arn:aws:iam::aws:policy/PowerUserAccess
#   3. aws iam delete-role --role-name <nombre>
#   4. aws cloudformation deploy --template-file .github/oidc/iam-role.yaml \
#        --stack-name github-oidc-iaapp-<env> --capabilities CAPABILITY_NAMED_IAM \
#        --parameter-overrides Environment=<env> RoleName=proy-app-gha-role-<env-suffix>
# ============================================================

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Ambiente"
        Parameters: [Environment, RoleName]
      - Label:
          default: "GitHub"
        Parameters: [GitHubOrg, GitHubRepo]
      - Label:
          default: "OIDC Provider"
        Parameters: [CreateOIDCProvider]

Parameters:

  Environment:
    Type: String
    AllowedValues: [dev, qa, prod]
    Description: "Cuenta destino"

  RoleName:
    Type: String
    Description: >
      Nombre del IAM Role. Convención del proyecto:
        dev  → proy-app-gha-role-development
        qa   → proy-app-gha-role-qa
        prod → proy-app-gha-role-prod

  GitHubOrg:
    Type: String
    Default: clouddev-udabol
    Description: "Organización GitHub dueña del repositorio"

  GitHubRepo:
    Type: String
    Default: aws-devops
    Description: "Repositorio que puede asumir este rol"

  CreateOIDCProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: >
      'false' (default) si el OIDC Provider ya existe en la cuenta.
      'true'  solo en cuentas nuevas donde no hay provider previo.

Conditions:
  ShouldCreateOIDCProvider: !Equals [!Ref CreateOIDCProvider, 'true']
  IsDevEnvironment:          !Equals [!Ref Environment, dev]

Resources:

  # ----------------------------------------------------------
  # OIDC IDENTITY PROVIDER
  # Solo se crea si CreateOIDCProvider = true.
  # En DEV y QA ya existe — se referencia por ARN directamente.
  # ----------------------------------------------------------
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOIDCProvider
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      Tags:
        - Key: Name
          Value: github-oidc-provider-iaapp
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: SOW
          Value: SOW-001

  # ----------------------------------------------------------
  # IAM ROLE — Asumido por GitHub Actions via OIDC
  # ----------------------------------------------------------
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      MaxSessionDuration: 3600
      Description: !Sub >
        Rol OIDC para GitHub Actions - repo ${GitHubOrg}/${GitHubRepo}.
        Ambiente: ${Environment}. SOW-001 UDABOL.

      # Trust Policy
      # DEV: acepta cualquier ref del repo (push, PR, dispatch, environment)
      # QA:  solo main branch o environment:qa (más restrictivo)
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowGitHubActionsOIDC
            Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !If
                  - IsDevEnvironment
                  - !Sub "repo:${GitHubOrg}/${GitHubRepo}:*"
                  - - !Sub "repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/main"
                    - !Sub "repo:${GitHubOrg}/${GitHubRepo}:environment:${Environment}"

      # PowerUserAccess: todos los permisos de servicios AWS excepto IAM global.
      # Suficiente para CloudFormation, EC2/VPC, CloudWatch Logs, Budgets, SNS.
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess"

      # IAMForVPCFlowLogs: permite crear/borrar el FlowLogsRole que el template
      # vpc.yaml define como AWS::IAM::Role. Necesario porque PowerUserAccess
      # no incluye iam:GetRole/CreateRole/etc.
      Policies:
        - PolicyName: IAMForVPCFlowLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: IAMForVPCFlowLogs
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:PassRole
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/role-vpc-flowlogs-*"

      Tags:
        - Key: Name
          Value: !Ref RoleName
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: iaapp
        - Key: Company
          Value: udabol
        - Key: ManagedBy
          Value: cloudformation
        - Key: SOW
          Value: SOW-001
        - Key: GitHubRepo
          Value: !Sub "${GitHubOrg}/${GitHubRepo}"

Outputs:

  RoleArn:
    Description: "ARN del rol — usar en GitHub Variable AWS_ROLE_DEV o AWS_ROLE_QA"
    Value: !GetAtt GitHubActionsRole.Arn
    Export:
      Name: !Sub "iaapp-${Environment}-GitHubActionsRoleArn"

  RoleName:
    Description: "Nombre del rol IAM"
    Value: !Ref GitHubActionsRole

  OIDCProviderArn:
    Description: "ARN del OIDC Provider en esta cuenta"
    Value: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"

  DeployCommand:
    Description: "Comando para desplegar este template"
    Value: !Sub >
      aws cloudformation deploy
      --template-file .github/oidc/iam-role.yaml
      --stack-name github-oidc-iaapp-${Environment}
      --capabilities CAPABILITY_NAMED_IAM
      --parameter-overrides Environment=${Environment} RoleName=${RoleName}
      --profile fdac-${Environment}
